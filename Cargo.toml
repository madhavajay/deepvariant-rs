[workspace]
resolver = "2"
members = [
    "crates/dv-proto",
    "crates/dv-io",
    "crates/dv-infer",
    "crates/dv-core",
    "crates/dv-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"
repository = "https://github.com/madhavajay/deepvariant-rust"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
bytes = "1"
prost = "0.13"
prost-build = "0.13"
noodles = { version = "0.92", features = ["bam", "cram", "sam", "vcf", "fasta", "bgzf", "csi", "tabix", "core"] }
crc32c = "0.6"
flate2 = "1"
rand = { version = "0.8", default-features = false }
rand_mt = { version = "5", default-features = false }
rayon = "1"

# Inference backends — gated by features in dv-infer
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "0.16"
tensorflow = "0.21"

[profile.release]
lto = "thin"
codegen-units = 1
