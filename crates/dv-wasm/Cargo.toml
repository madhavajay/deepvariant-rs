[package]
name = "dv-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

# Browser/wasm32 target for the pure-compute pieces of dv-core.
# `cdylib` so wasm-pack/wasm-bindgen can produce a `.wasm` + JS glue.
# `rlib` keeps unit tests runnable on the native target as well.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default = build with wasm-bindgen JS interop. Off when running unit
# tests natively so we don't pull in a wasm-only ABI.
default = ["wasm-bindgen"]
wasm-bindgen = ["dep:wasm-bindgen"]

[dependencies]
# dv-core with its `io` feature OFF (so no flate2 / noodles-cram).
dv-core = { path = "../dv-core", default-features = false }
dv-proto = { path = "../dv-proto" }
prost.workspace = true

# BAM-in-browser: noodles bam/bgzf are pure Rust (flate2 →
# miniz_oxide, NO cram so no bzip2/xz C deps). BAM is read from an
# in-memory Cursor (no std::fs), so this builds for wasm32.
noodles = { version = "0.92", default-features = false, features = ["bam", "sam", "bgzf", "core"] }

# Optional — only needed for the browser glue layer.
wasm-bindgen = { version = "0.2", optional = true }

# Native-only: dv-io drives the parity example (write wasm-produced
# examples to a TFRecord so native call-variants can score them).
# Never compiled for wasm32 (examples/tests are native targets).
[dev-dependencies]
dv-io = { path = "../dv-io" }
