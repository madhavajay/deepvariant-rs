[package]
name = "dv-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Default = full feature set (all IO / file-format modules enabled).
# `wasm` excludes everything that drags in C-only deps (noodles-cram's
# bzip2 / xz, dv-io's flate2/bgzf chain) so the pure-compute modules
# can build for wasm32-unknown-unknown.
default = ["io"]
io = ["dep:dv-io", "dep:noodles"]
# Opt-in experimental NEON row-max kernel for ssw::align_score. Off by
# default: the banded scalar path is faster and bit-exact (see FAST.md).
ssw-neon = []

[dev-dependencies]
flate2.workspace = true
noodles.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
rayon.workspace = true
dv-proto = { path = "../dv-proto" }
dv-io = { path = "../dv-io", optional = true }
prost.workspace = true
noodles = { workspace = true, optional = true }
rand.workspace = true
rand_mt.workspace = true
